<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action https://duckduckgo.com/">
<title>Start</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px system-ui, sans-serif; background: #15161a; color: #e6e6e6; }
  form { width: min(90vw, 560px); }
  input { width: 100%; box-sizing: border-box; padding: 14px 18px; font-size: 18px;
          border: 1px solid #3a3d45; border-radius: 10px; background: #1e2026; color: inherit; }
  input:focus { outline: 2px solid #5b9dff; border-color: transparent; }
  @media (prefers-color-scheme: light) {
    body { background: #fafafa; color: #1a1a1a; }
    input { background: #fff; border-color: #ccc; }
  }
</style>
</head>
<body>
<form action="https://duckduckgo.com/" method="get" role="search">
  <input type="search" name="q" placeholder="Search" aria-label="Search" autofocus autocomplete="off">
</form>
</body>
</html>
